<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Calculator</title>
    <link
      rel="icon"
      href=".\icon.png"
      type="image/x-icon"
    />
    <!--link rel="stylesheet" href="styles.css" /-->
    <style>
        /* Button*/
button {
  appearance: none;
  border: 0.2em solid #e91e63;
  background: hsl(0 0 0/0);
  padding: 0.85em 1.5em;
  color: #e91e63;
  border-radius: 2em;
  transition: 0.2s;
 
}
button:active {
  transform: scale(90%);
  background: #e91e63;
    color: #ffff;
}
button:hover {
  transform: scale(110%);
  
}
button:focus{
  border: 0.212em solid #e91e63;
  border-radius: 2em;
}
/* Text*/
input[type="text"],
input[type="number"] {
  appearance: none;
  border: none;
  outline: none;
  border-bottom: 0.2em solid #e91e63;
  background: rgba(#e91e63, 0.2);
  border-radius: 0.2em 0.2em 0 0;
  background-color: #ffd4e4;
  padding: 0.4em;
  color: #e91e63;
    box-sizing: border-box;
    width: 100%;
    max-width: 200px;
    height: 35px;
  text-align:right;
  font-size:20px;
}
*{
    -webkit-tap-highlight-color: transparent;
}
body {
  text-align: center;
  justify-content: center;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
}
.eq {
  border: 0.2em solid lime;
  color: lime;
  &:active {
    background: lime;
  }
  &:focus{
  border: 0.212em solid lime;
  border-radius: 2em;
}
}
.op {
  border: 0.2em solid goldenrod;
  color: goldenrod;
  &:focus{
  border: 0.212em solid goldenrod;
  border-radius: 2em;
}
  
  &:active {
    background: goldenrod;
  }
}
.clr {
  border: 0.2em solid red;
  color: red;
  &:focus{
  border: 0.212em solid red;
  border-radius: 2em;
}
  &:active {
    background: red;
  }
}

.calculator {
  display: inline-block;
}

/* Phones */
@media (max-width: 600px) {
  .calculator {
    transform: scale(1.45);
    transform-origin: top center;
    margin-top: 25px;
  }
}

/* Very small phones */
@media (max-width: 380px) {
  .calculator {
    transform: scale(1.7);
  }
}
.popup{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.35);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:9999;
    animation:fade .2s;
}

.popup-box{
    background:#fff0f6;
    border:3px solid #e91e63;
    border-radius:20px;
    padding:22px;
    width:280px;
    max-width:85%;
    text-align:center;
    color:#e91e63;
    font-size:18px;
    box-shadow:0 8px 25px rgba(0,0,0,.25);
}

.popup-box button{
    margin-top:18px;
    width:120px;
}

@keyframes fade{
    from{opacity:0;}
    to{opacity:1;}
}

@keyframes pop{
    from{
        transform:scale(.7);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

.popup-box{
    animation:pop .2s ease;
}
.theme-switch{
    position:fixed;
    top:calc(env(safe-area-inset-top) + 12px);
    right:15px;
    z-index:1000;
}

.switch{
    position:relative;
    display:inline-block;
    width:54px;
    height:30px;
}
.calculator{
    margin-top:20px;
}
.footer{
    color:#b0b0b0;
    opacity:.5;
    font-size:11px;
}
.switch input{
    display:none;
}

.slider{
    position:absolute;
    inset:0;
    cursor:pointer;
    background:#ffd4e4;
    border:2px solid #e91e63;
    border-radius:30px;
    transition:.3s;
}

.slider:before{
    content:"☀️";
    position:absolute;
    width:22px;
    height:22px;
    left:2px;
    top:2px;
    background:white;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    transition:.3s;
    font-size:13px;
}

input:checked + .slider{
    background:#333;
    border-color:#666;
}

input:checked + .slider:before{
    transform:translateX(24px);
    content:"🌙";
}

body.dark{
    background:#181818;
    color:white;
}

body.dark input{
    background:#2b2b2b;
    color:#ff8ac2;
}

body.dark .popup-box{
    background:#262626;
    color:#ff8ac2;
}

body.dark h1{
    color:#ff8ac2;
}
.footer{
    margin-top:20px;
    margin-bottom:15px;
    text-align:center;
    font-size:12px;
    color:#888;
    opacity:.7;
}

.footer:hover{
    opacity:1;
    color:#e91e63;
}
    </style>
  </head>
  <body>
    <div id="popup" class="popup">
  <div class="popup-box">
    <div id="popupText">Message</div>
    <button onclick="closePopup()">OK</button>
  </div>
</div>
<div class="theme-switch">
    <label class="switch">
        <input type="checkbox" id="themeToggle">
        <span class="slider"></span>
    </label>
</div>
    <div class="calculator">
    <h1>Calculator</h1>
    <input type="text" placeholder="0" id="ip" readonly /><br /><br>
    <button id="c" class="clr" title="clear" onclick="clr()">C</button>
    <button id="m" class="op" onclick="mem('M')">M</button>
    <button id="r" class="op" onclick="mem('R')">R</button>
    <button id="p" class="op" onclick="mem('P')">P</button>
    <br /><br />
    <button id="7" onclick="app('7')">7</button>
    <button id="8" onclick="app('8')">8</button>
    <button id="9" onclick="app('9')">9</button>
    <button id="+" class="op" onclick="app('+')">+</button>
    <br /><br />
    <button id="4" onclick="app('4')">4</button>
    <button  id="5" onclick="app('5')">5</button>
    <button id="6" onclick="app('6')">6</button>
    <button id="-" class="op" onclick="app('-')">–</button><br /><br />
    <button id="1" onclick="app('1')">1</button>
    <button id="2"  onclick="app('2')">2</button>
    <button id="3" onclick="app('3')">3</button>
    <button id="*" class="op" onclick="app('*')">×</button><br /><br />
    <button id="bs" class="clr" onclick="bs()">←</button>
    <button id="0" onclick="app('0')">0</button>
    <button id="." onclick="app('.')">.</button>
    <button id="/" class="op" onclick="app('/')">÷</button>
    <br /><br />
    <button class="eq" style="width: 200px; height: 40px" onclick="cal()">
      =</button
    ><br /><br />
    </div>
    
    <p style="color: lime" id="ss"></p>
    <audio
      id="clickSound"
      src="./click.mp3"
    ></audio>

    <script src="./math.js"></script>
    <script>
      function popup(msg){
    document.getElementById("popupText").innerHTML = msg;
    document.getElementById("popup").style.display = "flex";
    ps();
}

function closePopup(){
    document.getElementById("popup").style.display = "none";
}
      var re7 = 0;

      var exl = ""; // Initialize exl as an empty string to store error messages

      function ps() {
    const sound = document.getElementById("clickSound").cloneNode();
    sound.play().catch(() => {});
}
      function cal() {
        var a = document.getElementById("ip").value;

        // Check if the developer key is entered
        if (a === "111---000") {
          popup("Error log:\n" + exl);
          console.log(exl);
          clr();
          return; // Exit the function if developer key is used
        } else if (a === "111+++000") {
          popup("Memory: " + re7);
          return;// Exit the function if developer key is used
        }

        try {
          var result = math.evaluate(a);
          if (isNaN(result) || a.includes("/0") ) {
            if (a.includes("/0")) {
              popup("Can't Divide By Zero");
              clr();
            } else {
              popup("Invalid input");
              clr();
            }
            return 0;
          } else {
            document.getElementById("ip").value = result;
            ps();
            return result;
          }
        } catch (e) {
          if (e.message.includes("expected")) {
            popup("Enter a valid Expression\n ");
            document.getElementById("ip").value = "";
          }
          // Append the error message to exl
          exl += "\nError: " + e.message;
          console.log("Error: " + e.message); // popup the current error
        }
        ps();
      }

      function app(sy) {
        var input = document.getElementById("ip");
        var a = document.getElementById("ip").value;
         if ((a === "" || a === "0") && sy === ".") {
        input.value = "0.";
        ps();
        return;
    }const ops = "+-*/";

// Prevent duplicate operators (except developer keys)
if (ops.includes(sy) && a !== "111" && !a.startsWith("111+") && !a.startsWith("111-")) {
    const last = a.slice(-1);

    if (ops.includes(last)) {
        input.value = a.slice(0, -1) + sy;
        ps();
        return;
    }
}

// Prevent multiple decimal points in the current number
if (sy === ".") {
    const currentNumber = a.split(/[+\-*/]/).pop();

    if (currentNumber.includes(".")) {
        ps();
        return;
    }
}
     if (a === "0" && "+-*/".includes(sy)) {
        input.value += sy;   // 0+, 0-, 0*, 0/
        ps();
        return;
    }
        if (a=='0' || a=='') {
          if(sy>0){
            input.value += sy;
          } else if(a=='' && sy=='0'){
            document.getElementById('ip').value = "0";
          }
       }else input.value += sy;

        ps();
      }
      function bs() {
        var textbox = document.getElementById("ip");
        var a = document.getElementById("ip").value;
        textbox.value = textbox.value.slice(0, -1); // Remove the last character
         if (textbox.value === "") {
        textbox.placeholder = "0";
    }
        ps();
      }

      function clr() {
        document.getElementById("ip").value = "";
        ps();
      }
      function mem(mode) {
        if (mode == "M") {
          re7 = cal();
          if (re7) {
            popup("Saved to Memory Successfully");
          } else {
            popup("Unable to save ");
          }
        }
        if (mode == "R") {
          if (re7) {
            popup("Memory Erased");
            re7 = 0;
          } else {
            popup("Memory Empty");
          }
        }
        if (mode == "P") {
          if (re7 !== 0) {
    const input = document.getElementById("ip");

    if (input.value === "" || input.value === "0") {
        input.value = re7;
    } else {
        input.value += re7;
    }

    suc("ss", "Paste complete!");
} else {
    popup("Memory Empty");
}
        }
        ps();
      }
      function suc(id, cnt, ty) {
        ps();
        document.getElementById(id).textContent = cnt;
        setTimeout(function () {
          document.getElementById(id).textContent = "";
        }, 1000);
      }
      function sutb(id, cnt, ti) {
        ps();
        document.getElementById(id).value = cnt;
        setTimeout(function () {
          document.getElementById(id).value = "";
        }, ti);
      }
const toggle = document.getElementById("themeToggle");

toggle.checked = localStorage.getItem("theme") === "dark";
document.body.classList.toggle("dark", toggle.checked);

toggle.onchange = () => {
    document.body.classList.toggle("dark", toggle.checked);
    localStorage.setItem("theme", toggle.checked ? "dark" : "light");
};

      // Add keyboard support
      document.addEventListener("keydown", function (event) {
        if (event.key >= "0" && event.key <= "9") {
          //app(event.key);
          
           document.getElementById(event.key).click();
        } else if (event.key === "+") {
          app("+");
        } else if (event.key === "-") {
          app("-");
        } else if (event.key === "*") {
          app("*");
        } else if (event.key === "/") {
          app("/");
        } else if (event.key === ".") {
          app(".");
        } else if (event.key.toLowerCase() === "e") {
          app("e");
        } else if (event.key.toLowerCase() === "p") {
          app(math.evaluate("pi"));
        } else if (event.key === "Enter") {
          cal();
          event.preventDefault();
        } else if (event.key === "Backspace") {
          bs();
        } else if (event.key === "Escape" || event.key.toLowerCase() === "c") {
          //clr();
          sutb("ip", "Cleard!", 350);
        } else if (event.key === "m" || event.key === "M") {
          mem("M");
        } else if (event.key === "r" || event.key === "R") {
          mem("R");
        } else if (event.key === "v" || event.key === "V") {
          mem("P");
        }
        
      });
    </script>
    
  </body>
</html>
