<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Calculator ✨</title>
    <link rel="icon" href="./icon.png" type="image/x-icon" />
    <style>
      :root {
        --bg-grad: linear-gradient(135deg, #ffe6f0 0%, #fff5f9 50%, #f3e7ff 100%);
        --card-bg: rgba(255, 255, 255, 0.72);
        --card-border: rgba(255, 255, 255, 0.9);
        --card-shadow: 0 25px 50px -12px rgba(233, 30, 99, 0.22),
          inset 0 1px 1px rgba(255, 255, 255, 0.9);
        --text-main: #c2185b;
        --text-muted: #e57399;
        --display-bg: rgba(255, 228, 239, 0.65);
        --display-border: rgba(233, 30, 99, 0.25);
        --caret: #e91e63;

        --btn-bg: rgba(255, 255, 255, 0.85);
        --btn-border: rgba(233, 30, 99, 0.18);
        --btn-shadow: 0 4px 12px rgba(233, 30, 99, 0.1);
        --btn-hover: #fff0f6;

        --op-bg: rgba(255, 243, 205, 0.85);
        --op-color: #d97706;
        --op-border: rgba(217, 119, 6, 0.25);

        --clr-bg: rgba(254, 226, 226, 0.85);
        --clr-color: #e11d48;
        --clr-border: rgba(225, 29, 72, 0.25);

        --eq-grad: linear-gradient(135deg, #ff4d94 0%, #e91e63 100%);
        --eq-shadow: 0 8px 20px rgba(233, 30, 99, 0.35);
      }

      body.dark {
        --bg-grad: radial-gradient(circle at top left, #2a1222 0%, #121016 55%, #0d0c11 100%);
        --card-bg: rgba(28, 22, 34, 0.78);
        --card-border: rgba(255, 138, 194, 0.2);
        --card-shadow: 0 25px 60px rgba(0, 0, 0, 0.65),
          0 0 30px rgba(233, 30, 99, 0.15),
          inset 0 1px 1px rgba(255, 255, 255, 0.08);
        --text-main: #ff8ac2;
        --text-muted: #b36b8e;
        --display-bg: rgba(16, 12, 20, 0.75);
        --display-border: rgba(255, 138, 194, 0.25);
        --caret: #ff5ca8;

        --btn-bg: rgba(44, 34, 52, 0.85);
        --btn-border: rgba(255, 138, 194, 0.15);
        --btn-shadow: 0 4px 12px rgba(0, 0, 0, 0.35);
        --btn-hover: rgba(65, 48, 77, 0.95);

        --op-bg: rgba(66, 48, 24, 0.75);
        --op-color: #fbbf24;
        --op-border: rgba(251, 191, 36, 0.25);

        --clr-bg: rgba(76, 26, 40, 0.75);
        --clr-color: #fb7185;
        --clr-border: rgba(251, 113, 133, 0.25);

        --eq-grad: linear-gradient(135deg, #ff5ca8 0%, #d81b60 100%);
        --eq-shadow: 0 8px 25px rgba(255, 92, 168, 0.4);
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: var(--bg-grad);
        color: var(--text-main);
        transition: background 0.4s ease, color 0.3s ease;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        overflow-x: hidden;
        padding: 16px;
      }

      /* Ambient glowing orbs behind the glass */
      body::before,
      body::after {
        content: "";
        position: fixed;
        width: 280px;
        height: 280px;
        border-radius: 50%;
        filter: blur(75px);
        z-index: -1;
        opacity: 0.55;
        pointer-events: none;
      }

      body::before {
        background: #ff7eb3;
        top: 8%;
        left: 12%;
      }

      body::after {
        background: #c084fc;
        bottom: 8%;
        right: 12%;
      }

      /* Theme Toggle */
      .theme-switch {
        position: fixed;
        top: calc(env(safe-area-inset-top) + 16px);
        right: 18px;
        z-index: 1000;
      }

      .switch {
        position: relative;
        display: inline-block;
        width: 58px;
        height: 32px;
      }

      .switch input {
        display: none;
      }

      .slider {
        position: absolute;
        inset: 0;
        cursor: pointer;
        background: var(--card-bg);
        backdrop-filter: blur(12px);
        border: 1.5px solid var(--card-border);
        border-radius: 30px;
        box-shadow: 0 4px 15px rgba(233, 30, 99, 0.18);
        transition: 0.3s ease;
      }

      .slider:before {
        content: "☀️";
        position: absolute;
        width: 24px;
        height: 24px;
        left: 3px;
        top: 2.5px;
        background: #fff;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        font-size: 13px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      }

      input:checked + .slider:before {
        transform: translateX(26px);
        content: "🌙";
        background: #2b2135;
      }

      /* Main Calculator Chassis */
      .calculator {
        width: 100%;
        max-width: 340px;
        background: var(--card-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1.5px solid var(--card-border);
        border-radius: 32px;
        padding: 24px 20px 22px;
        box-shadow: var(--card-shadow);
        transition: all 0.35s ease;
      }

      .calc-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
        padding: 0 4px;
      }

      .calc-header h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        color: var(--text-muted);
      }

      .status-toast {
        margin: 0;
        font-size: 12px;
        font-weight: 600;
        color: #10b981;
        min-height: 16px;
        transition: opacity 0.2s;
      }

      /* Display Screen with Blinking Caret */
      .display-wrap {
        position: relative;
        margin-bottom: 18px;
      }

      input[type="text"]#ip {
        appearance: none;
        width: 100%;
        height: 74px;
        border: 1.5px solid var(--display-border);
        border-radius: 20px;
        background: var(--display-bg);
        padding: 12px 18px;
        color: var(--text-main);
        caret-color: var(--caret);
        text-align: right;
        font-size: 32px;
        font-weight: 700;
        letter-spacing: 0.5px;
        outline: none;
        user-select: text;
        -webkit-user-select: text;
        box-shadow: inset 0 3px 10px rgba(0, 0, 0, 0.04);
        transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.3s ease;
      }

      input[type="text"]#ip:focus {
        border-color: var(--caret);
        box-shadow: inset 0 3px 10px rgba(0, 0, 0, 0.04),
          0 0 0 3px rgba(233, 30, 99, 0.14);
      }

      input[type="text"]#ip::placeholder {
        color: var(--text-muted);
        opacity: 0.55;
      }

      /* 4-Column Keypad Grid */
      .keypad {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 11px;
      }

      button {
        appearance: none;
        height: 56px;
        border-radius: 18px;
        border: 1.5px solid var(--btn-border);
        background: var(--btn-bg);
        color: var(--text-main);
        font-size: 20px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: var(--btn-shadow);
        transition: transform 0.14s cubic-bezier(0.34, 1.56, 0.64, 1),
          background 0.2s ease, box-shadow 0.2s ease;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      button:hover {
        background: var(--btn-hover);
        transform: translateY(-2px);
      }

      button:active {
        transform: scale(0.92);
      }

      button:focus {
        outline: none;
      }

      /* Operators & Memory */
      .op {
        background: var(--op-bg);
        color: var(--op-color);
        border-color: var(--op-border);
        font-weight: 700;
      }

      .op:hover {
        filter: brightness(1.04);
      }

      /* Clear & Backspace */
      .clr {
        background: var(--clr-bg);
        color: var(--clr-color);
        border-color: var(--clr-border);
        font-weight: 700;
      }

      .clr:hover {
        filter: brightness(1.04);
      }

      /* Equals Hero Button */
      .eq {
        grid-column: span 4;
        height: 54px;
        margin-top: 2px;
        border: none;
        border-radius: 18px;
        background: var(--eq-grad);
        color: #ffffff;
        font-size: 24px;
        font-weight: 700;
        box-shadow: var(--eq-shadow);
      }

      .eq:hover {
        background: var(--eq-grad);
        filter: brightness(1.08);
        transform: translateY(-2px);
      }

      /* Popup Modal */
      .popup {
        position: fixed;
        inset: 0;
        background: rgba(15, 10, 20, 0.45);
        backdrop-filter: blur(6px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        animation: fade 0.2s ease;
      }

      .popup-box {
        background: var(--card-bg);
        backdrop-filter: blur(22px);
        border: 1.5px solid var(--card-border);
        border-radius: 26px;
        padding: 24px 22px;
        width: 290px;
        max-width: 86%;
        text-align: center;
        color: var(--text-main);
        font-size: 16px;
        font-weight: 600;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25);
        animation: pop 0.24s cubic-bezier(0.34, 1.56, 0.64, 1);
        white-space: pre-line;
      }

      .popup-box button {
        margin: 18px auto 0;
        width: 130px;
        height: 44px;
        border: none;
        background: var(--eq-grad);
        color: #fff;
        font-size: 15px;
        box-shadow: var(--eq-shadow);
      }

      @keyframes fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes pop {
        from {
          transform: scale(0.8);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      @media (max-width: 360px) {
        .calculator {
          padding: 18px 14px;
          border-radius: 26px;
        }
        button {
          height: 50px;
          font-size: 18px;
          border-radius: 15px;
        }
        input[type="text"]#ip {
          height: 64px;
          font-size: 28px;
        }
      }
    </style>
  </head>
  <body>
    <div id="popup" class="popup">
      <div class="popup-box">
        <div id="popupText">Message</div>
        <button onclick="closePopup()">OK</button>
      </div>
    </div>

    <div class="theme-switch">
      <label class="switch">
        <input type="checkbox" id="themeToggle" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="calculator">
      <div class="calc-header">
        <h1>Calculator ✦</h1>
        <p class="status-toast" id="ss"></p>
      </div>

      <div class="display-wrap">
        <input
          type="text"
          placeholder="0"
          id="ip"
          inputmode="none"
          autocomplete="off"
          spellcheck="false"
        />
      </div>

      <div class="keypad">
        <button id="c" class="clr" title="Clear" onmousedown="event.preventDefault()" onclick="clr()">C</button>
        <button id="m" class="op" title="Save to Memory" onmousedown="event.preventDefault()" onclick="mem('M')">M</button>
        <button id="r" class="op" title="Erase Memory" onmousedown="event.preventDefault()" onclick="mem('R')">R</button>
        <button id="p" class="op" title="Paste Memory" onmousedown="event.preventDefault()" onclick="mem('P')">P</button>

        <button id="7" onmousedown="event.preventDefault()" onclick="app('7')">7</button>
        <button id="8" onmousedown="event.preventDefault()" onclick="app('8')">8</button>
        <button id="9" onmousedown="event.preventDefault()" onclick="app('9')">9</button>
        <button id="+" class="op" onmousedown="event.preventDefault()" onclick="app('+')">+</button>

        <button id="4" onmousedown="event.preventDefault()" onclick="app('4')">4</button>
        <button id="5" onmousedown="event.preventDefault()" onclick="app('5')">5</button>
        <button id="6" onmousedown="event.preventDefault()" onclick="app('6')">6</button>
        <button id="-" class="op" onmousedown="event.preventDefault()" onclick="app('-')">–</button>

        <button id="1" onmousedown="event.preventDefault()" onclick="app('1')">1</button>
        <button id="2" onmousedown="event.preventDefault()" onclick="app('2')">2</button>
        <button id="3" onmousedown="event.preventDefault()" onclick="app('3')">3</button>
        <button id="*" class="op" onmousedown="event.preventDefault()" onclick="app('×')">×</button>

        <button id="bs" class="clr" title="Backspace" onmousedown="event.preventDefault()" onclick="bs()">←</button>
        <button id="0" onmousedown="event.preventDefault()" onclick="app('0')">0</button>
        <button id="." onmousedown="event.preventDefault()" onclick="app('.')">.</button>
        <button id="/" class="op" onmousedown="event.preventDefault()" onclick="app('÷')">÷</button>

        <button class="eq" onmousedown="event.preventDefault()" onclick="cal()">=</button>
      </div>
    </div>

   

    <script src="./math.js"></script>
    <script>
      var kokoro = null;
      var exl = "";
      const ipEl = document.getElementById("ip");

      // Keep the blinking caret alive right when the page loads
      window.addEventListener("load", () => {
        ipEl.focus();
      });

      function popup(msg) {
        document.getElementById("popupText").textContent = msg;
        document.getElementById("popup").style.display = "flex";
        ps();
      }

      function closePopup() {
        document.getElementById("popup").style.display = "none";
        ipEl.focus();
      }

     

// 10-channel preloaded Audio Pool (works in WebView file:// & browsers!)
const AUDIO_POOL_SIZE = 10;
const clickPool = Array.from({ length: AUDIO_POOL_SIZE }, () => {
  const audio = new Audio("./click.mp3");
  audio.preload = "auto";
  return audio;
});
let poolFallbackIdx = 0;

function ps() {
  // Find the first audio slot that is not currently playing
  let player = clickPool.find((a) => a.paused || a.ended);

  // If all 10 are somehow playing at the exact same split-second, cycle the oldest one
  if (!player) {
    player = clickPool[poolFallbackIdx];
    poolFallbackIdx = (poolFallbackIdx + 1) % AUDIO_POOL_SIZE;
  }

  player.currentTime = 0;
  player.play().catch(() => {});
}


      // Helper to insert text right at the blinking cursor position
      function insertAtCursor(str) {
        ipEl.focus();
        const start = ipEl.selectionStart ?? ipEl.value.length;
        const end = ipEl.selectionEnd ?? ipEl.value.length;
        const val = ipEl.value;

        ipEl.value = val.slice(0, start) + str + val.slice(end);
        const newPos = start + str.length;
        ipEl.setSelectionRange(newPos, newPos);
      }

      function cal() {
        var a = ipEl.value.trim();

        if (a === "") {
          ipEl.focus();
          ps();
          return null;
        }

        // Developer keys
        if (a === "111---111") {
          popup("Error log:\n" + (exl || "No errors yet!"));
          console.log(exl);
          clr();
          return null;
        } else if (a === "111+++111") {
          popup("Memory: " + (kokoro !== null ? kokoro : "Empty"));
          return null;
        }

        // Swap pretty symbols (×, ÷, –) to math operators (*, /, -) before evaluating
        var expr = a.replace(/×/g, "*").replace(/÷/g, "/").replace(/–/g, "-");

        try {
          var result = math.evaluate(expr);
          if (typeof result !== "number" ) {
            popup("Invalid input");
            clr();
            return null;
          }
          if (!isFinite(result)) {
            popup("Can't Divide By Zero");
            clr();
            return null;
          }

          result = Number(result.toPrecision(12));
          ipEl.value = String(result);
          ipEl.focus();
          ipEl.setSelectionRange(ipEl.value.length, ipEl.value.length);
          ps();
          return result;
        } catch (e) {
          console.log("Enter a valid Expression: \n"+e.message);
          popup("Enter a valid Expression: \n"+e.message);
          

          ipEl.value = "";
          exl += "\nError: " + e.message;
          console.log("Error: " + e.message);
          return null;
        }
      }

      function app(sy) {
        for (let i of sy) {
  if (!"1234567890÷×-+.e/*".includes(i)) {
     popup("Nice try 😏");
     return;
     
  }
}
         
        
        ipEl.focus();
        const a = ipEl.value;
        const start = ipEl.selectionStart ?? a.length;
        const end = ipEl.selectionEnd ?? a.length;
        const before = a.slice(0, start);
        const after = a.slice(end);
        const ops = "+-–*×/÷";

        

        // Normalize keyboard * and / to pretty × and ÷ on screen
        if (sy === "*") sy = "×";
        if (sy === "/") sy = "÷";

        // Decimal handling around cursor
        if (sy === ".") {
          const leftNum = before.split(/[+\-–*×/÷]/).pop();
          const rightNum = after.split(/[+\-–*×/÷]/)[0];
          if ((leftNum + rightNum).includes(".")) {
            ps();
            return;
          }
          if (leftNum === "") {
            insertAtCursor("0.");
            ps();
            return;
          }
        }

        // Operator guard around cursor (except developer keys)
        if (
          ops.includes(sy) &&
          a !== "111" &&
          !a.startsWith("111+") &&
          !a.startsWith("111-")
        ) {
          if (before === "" && after === "") {
            if (sy === "-" || sy === "–") {
              insertAtCursor("-");
            }
            ps();
            return;
          }
          const prevChar = before.slice(-1);
          const nextChar = after.slice(0, 1);

          // If cursor is right after an operator, replace that operator
          if (ops.includes(prevChar)) {
            ipEl.value = before.slice(0, -1) + sy + after;
            const pos = start;
            ipEl.setSelectionRange(pos, pos);
            ps();
            return;
          }
          // If cursor is right before an operator, replace that next operator
          if (ops.includes(nextChar)) {
            ipEl.value = before + sy + after.slice(1);
            const pos = start + 1;
            ipEl.setSelectionRange(pos, pos);
            ps();
            return;
          }
        }

        // Replace lone leading zero when typing a digit
        if (a === "0" && start === 1 && !ops.includes(sy) && sy !== ".") {
          ipEl.value = sy;
          ipEl.setSelectionRange(1, 1);
          ps();
          return;
        }

        // Replace standalone zero right after an operator before cursor
        if (/(^|[+\-–*×/÷])0$/.test(before) && !ops.includes(sy) && sy !== ".") {
          ipEl.value = before.slice(0, -1) + sy + after;
          ipEl.setSelectionRange(start, start);
          ps();
          return;
        }

        insertAtCursor(sy);
        ps();
      }

      function bs() {
        ipEl.focus();
        const start = ipEl.selectionStart ?? ipEl.value.length;
        const end = ipEl.selectionEnd ?? ipEl.value.length;
        const val = ipEl.value;

        if (start !== end) {
          // Delete selected range
          ipEl.value = val.slice(0, start) + val.slice(end);
          ipEl.setSelectionRange(start, start);
        } else if (start > 0) {
          // Delete one character directly behind the blinking cursor
          ipEl.value = val.slice(0, start - 1) + val.slice(start);
          ipEl.setSelectionRange(start - 1, start - 1);
        }

        if (ipEl.value === "") {
          ipEl.placeholder = "0";
        }
        ps();
      }

      function clr() {
        ipEl.value = "";
        ipEl.placeholder = "0";
        ipEl.focus();
        ps();
      }

      function mem(mode) {
        if (mode === "M") {
          var val = cal();
          if (val !== null && typeof val === "number" && isFinite(val)) {
            kokoro = val;
            popup("Saved to Memory Successfully");
          } else {
            popup("Unable to save");
          }
        } else if (mode === "R") {
          if (kokoro !== null) {
            kokoro = null;
            popup("Memory Erased");
          } else {
            popup("Memory Empty");
          }
        } else if (mode === "P") {
          if (kokoro !== null) {
            if (ipEl.value === "" || ipEl.value === "0") {
              ipEl.value = String(kokoro);
              ipEl.focus();
              ipEl.setSelectionRange(ipEl.value.length, ipEl.value.length);
            } else {
              insertAtCursor(String(kokoro));
            }
            suc("ss", "Paste complete!");
          } else {
            popup("Memory Empty");
          }
        }
        ps();
      }

      function suc(id, cnt) {
        ps();
        document.getElementById(id).textContent = cnt;
        setTimeout(function () {
          document.getElementById(id).textContent = "";
        }, 1000);
      }

      function sutb(id, cnt, ti) {
        ps();
        const el = document.getElementById(id);
        el.value = cnt;
        setTimeout(function () {
          el.value = "";
          el.focus();
        }, ti);
      }

      const toggle = document.getElementById("themeToggle");
      toggle.checked = localStorage.getItem("theme") === "dark";
      document.body.classList.toggle("dark", toggle.checked);

      toggle.onchange = () => {
        document.body.classList.toggle("dark", toggle.checked);
        localStorage.setItem("theme", toggle.checked ? "dark" : "light");
      };

      document.addEventListener("keydown", function (event) {
        if (!event.ctrlKey && !event.metaKey && !event.altKey) {
          event.preventDefault();
        }
        const popupEl = document.getElementById("popup");
        if (popupEl.style.display === "flex") {
          if (event.key === "Enter" || event.key === "Escape") {
            closePopup();
            event.preventDefault();
          }
          return;
        }

        // Allow Left / Right / Home / End arrow keys to move the blinking cursor naturally
        if (
          event.key === "ArrowLeft" ||
          event.key === "ArrowRight" ||
          event.key === "Home" ||
          event.key === "End"
        ) {
          ipEl.focus();
          return;
        }

        if (event.key >= "0" && event.key <= "9") {
          event.preventDefault();
          document.getElementById(event.key).click();
        } else if (event.key === "+") {
          event.preventDefault();
          app("+");
        } else if (event.key === "-") {
          event.preventDefault();
          app("-");
        } else if (event.key === "*") {
          event.preventDefault();
          app("×");
        } else if (event.key === "/") {
          event.preventDefault();
          app("÷");
        } else if (event.key === ".") {
          event.preventDefault();
          app(".");
        } else if (event.key.toLowerCase() === "e") {
          event.preventDefault();
          app(String(math.evaluate("e")));
        } else if (event.key.toLowerCase() === "p") {
          event.preventDefault();
          app(String(math.evaluate("pi")));
